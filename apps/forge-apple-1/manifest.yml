# Forge Apple 1 - workflow rules for the Jira workflow "Forge Apple 1".
# All business logic comes from the shared library @vinod/forge-common.
modules:
  # Validator: runs when the user clicks the transition; can block it with a message.
  jira:workflowValidator:
    - key: fa1-summary-length-validator
      name: "FA1 – Summary length ≥ 10"
      description: "Blocks the transition unless the summary has at least 10 characters."
      function: fa1-validate-summary

  # Condition: decides whether the transition button is shown at all.
  # Expression-based (Jira expression), so no function/code is needed.
  jira:workflowCondition:
    - key: fa1-assignee-only-condition
      name: "FA1 – Only assignee can transition"
      description: "Only the current assignee can see and use this transition."
      expression: issue.assignee != null && issue.assignee.accountId == user.accountId

  # Post function: runs asynchronously AFTER the transition has completed.
  jira:workflowPostFunction:
    - key: fa1-audit-comment-postfunction
      name: "FA1 – Add audit comment"
      description: "Adds an audit comment to the issue after the transition."
      function: fa1-audit-comment

  # Maps function keys (used above) to exported handlers in src/index.js.
  function:
    - key: fa1-validate-summary
      handler: index.validateSummary
    - key: fa1-audit-comment
      handler: index.auditComment

app:
  runtime:
    name: nodejs22.x
    memoryMB: 256
    architecture: arm64
  id: ari:cloud:ecosystem::app/fbb12828-bdc6-4e33-86f8-66e98d5b305a

permissions:
  scopes:
    - read:jira-work    # getIssue
    - write:jira-work   # addComment
